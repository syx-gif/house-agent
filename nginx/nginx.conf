server {
    listen 80;
    server_name _;

    # 前端静态文件（house.html 就放这里）
    root /usr/share/nginx/html;
    index house.html;

    # 精确匹配静态页面
    location = /house.html {
        add_header Cache-Control "no-cache";
    }

    # 其余路径优先找静态文件，找不到就回退到 house.html
    location / {
        try_files $uri $uri/ /house.html;
    }

    # 反向代理 LangGraph API：/threads /runs /assistants /ok 等
    # 浏览器访问 http://服务器IP/threads 会被转发到容器内部的 langgraph-api:8000
    location ~ ^/(threads|assistants|runs|ok|versions|docs|openapi|metrics|deployments|identities|store|crons|batch|listen|sse) {
        proxy_pass http://langgraph-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式响应不能缓冲，否则前端收不到实时 token
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
