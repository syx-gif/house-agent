server {
    listen 80;
    server_name _;

    # 前端静态文件（house.html 就放这里）
    root /usr/share/nginx/html;
    index house.html;

    # ===== 访问认证（HTTP Basic）=====
    # 作用：任何人打开网站先弹「输入用户名密码」框，没凭据一律 401，防止他人白用你的 GLM 额度。
    # 密码文件由 htpasswd 生成，通过 docker-compose 挂载到容器内 /etc/nginx/.htpasswd：
    #     htpasswd -cbm nginx/.htpasswd house '你的密码'
    # ⚠️ 两个前提：
    #   1) 该文件必须先存在，否则 nginx 启动报错（挂载不存在的文件会变成空目录）；
    #   2) 该文件已在 .gitignore 中，绝不能提交到公开仓库。
    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 精确匹配静态页面
    location = /house.html {
        add_header Cache-Control "no-cache";
    }

    # 其余路径优先找静态文件，找不到就回退到 house.html
    location / {
        try_files $uri $uri/ /house.html;
    }

    # 反向代理 LangGraph API：/threads /runs /assistants /ok 等
    # 浏览器访问 http://服务器IP/threads 会被转发到容器内部的 langgraph-api:8000
    location ~ ^/(threads|assistants|runs|ok|versions|docs|openapi|metrics|deployments|identities|store|crons|batch|listen|sse) {
        proxy_pass http://langgraph-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式响应不能缓冲，否则前端收不到实时 token
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
