# ============================================================
# 部署姿势2：用 langgraph dockerfile 生成的 Dockerfile 构建镜像
# 用法（在 ~/my_langgraph_app 根目录）：
#   1) 生成 Dockerfile：langgraph dockerfile -c langgraph.json Dockerfile
#   2) 准备环境变量：  cp deploy/.env.example .env  然后改 .env
#   3) 构建并启动：    docker compose up -d --build
#   4) 验证：          curl http://localhost:8123/ok   → {"ok":true}
# ============================================================

volumes:
  langgraph-data:
  mysql-data:

services:
  # 1) Redis：LangGraph 的任务队列 / 流式推送通道
  langgraph-redis:
    image: redis:6
    container_name: langgraph-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5

  # 2) PostgreSQL：LangGraph 自己存 agent 状态/检查点用的，和房源无关
  langgraph-postgres:
    image: postgres:16
    container_name: langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  # 3) 房源 MySQL：你的 agent 通过 get_conn() 连这个库查房源
  #    DB_HOST 在 .env 里填 compose 服务名 "mysql"，密码用 .env 的 DB_PASSWORD
  mysql:
    image: mysql:8
    container_name: house-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      # 只绑定到 127.0.0.1：虚拟机上仍可用 mysql 客户端连，但外部（含公网穿透/端口映射）连不进来。
      # ⚠️ 千万别写成 "3306:3306"（等价 0.0.0.0:3306），那等于把数据库 root 账号直接挂在公网上，
      #    会被扫描器在几分钟内攻破（挖矿/勒索）。Redis 6379、Postgres 5432 同理，一律不要对外映射。
      #    数据库密码请用强口令并在 .env 的 DB_PASSWORD 中设置，不要用弱口令。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 1s
      retries: 5

  # 4) LangGraph API：用刚才生成的 Dockerfile 现场构建镜像（不再依赖 langgraph build 预先打好的镜像）
  langgraph-api:
    # build 指向根目录的 Dockerfile（即 langgraph dockerfile 命令生成的那个）
    build:
      context: .
      dockerfile: Dockerfile
    # 给构建出来的镜像起个名字，方便以后 docker images 查看/清理
    image: my-langgraph-agent
    container_name: langgraph-api
    restart: unless-stopped
    ports:
      - "8123:8000"          # 对外 8123，容器内 langgraph-api 跑在 8000
    depends_on:
      langgraph-redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file:
      - .env                 # 从根目录 .env 注入所有变量（和 deploy/.env.example 同结构）
    environment:
      # 下面三项必须显式指定，把服务名解析成容器内部地址
      REDIS_URI: redis://langgraph-redis:6379
      POSTGRES_URI: postgres://postgres:${POSTGRES_PASSWORD}@langgraph-postgres:5432/postgres?sslmode=disable
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
    volumes:
      # 【开发期提速关键】把源码目录直接挂进容器。
      # 镜像里的包是 `uv pip install -e .`（editable 可编辑安装），代码从磁盘实时读取，
      # 所以覆盖 src/ 后改动立即生效 —— 改完只要 restart，不用重新 build。
      #
      #   ✅ 只改了 .py / .html：  sudo docker compose restart langgraph-api   （约 3 秒）
      #   ✅ 改了依赖(pyproject.toml)或 Dockerfile：才需要 --build
      #
      # 这也是「每次改一行代码要等好几分钟」的根治办法：跳过 ADD + pip install 这两层。
      - ./src:/deps/my_langgraph_app/src

  # 5) Nginx：提供静态前端页面 + 反向代理 LangGraph API（同源，无 CORS 问题）
  #    浏览器只访问 http://服务器IP/ 即可，无需单独记 API 端口
  nginx:
    image: nginx:alpine
    container_name: house-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro          # 把项目 static 目录挂进去当网页根目录
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTP Basic 访问口令文件（本机用 htpasswd 生成后放这里，已被 .gitignore 忽略）
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - langgraph-api
